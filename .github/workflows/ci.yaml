name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the packages
        run: pnpm -r --parallel -F "./packages/*" build

      - name: Run linters
        run: pnpm lint

      - name: Type check
        run: pnpm -r --parallel typecheck

      - name: Run unit test
        run: pnpm -r --parallel test

      - name: Build the apps
        run: pnpm -r --parallel -F "./apps/*" build

      # Ensure client app locales types are up to date
      - name: Check locales types
        run: |
          pnpm -F "./apps/client" script:generate-i18n-types
          git diff --exit-code -- apps/client/src/modules/i18n/locales.types.ts > /dev/null || (echo "Locales types are outdated, please run 'pnpm script:generate-i18n-types' and commit the changes." && exit 1)
