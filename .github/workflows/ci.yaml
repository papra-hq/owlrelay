name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linters
        run: pnpm -r --parallel lint --quiet

      - name: Type check
        run: pnpm -r --parallel typecheck

      - name: Run unit test
        run: pnpm -r --parallel test

      - name: Build the packages
        run: pnpm -r --parallel build

      # Ensure client app locales types are up to date
      - name: Check locales types
        run: |
          pnpm -F "./apps/client" script:generate-i18n-types
          git diff --exit-code -- apps/client/src/modules/i18n/locales.types.ts > /dev/null || (echo "Locales types are outdated, please run 'pnpm script:generate-i18n-types' and commit the changes." && exit 1)
